<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.title }} - NoSQLVerse</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #090d16; color: #f8fafc; padding: 40px 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #111827; padding: 35px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        h1 { color: #f8fafc; margin-bottom: 10px; font-size: 26px; }
        .chapter { border-bottom: 1px solid #1f2937; padding-bottom: 20px; margin-bottom: 20px; }
        .chapter h3 { color: #38bdf8; font-size: 18px; margin-bottom: 8px; }
        .chapter p { line-height: 1.7; color: #94a3b8; font-size: 14px; margin: 0; }
        a.btn, button.btn { background: #2563eb; color: white; padding: 12px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; display: inline-block; border: none; cursor: pointer; transition: all 0.3s; }
        a.btn:hover, button.btn:hover { background: #1d4ed8; box-shadow: 0 0 12px rgba(37, 99, 235, 0.4); transform: translateY(-1px); }
        .back-link { color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 14px; transition: color 0.3s; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ course.title }}</h1>
        <p style="color: #94a3b8; font-size: 15px; margin-bottom: 30px;">{{ course.description }}</p>
        <hr style="margin: 25px 0; border:0; border-top:1px solid #1f2937;">
        
        <h2 style="font-size: 20px; color: #f1f5f9; margin-bottom: 20px;">Course Chapters</h2>
        {% for ch in course.chapters %}
        <div class="chapter">
            <h3>Chapter {{ loop.index }}: {{ ch.title }}</h3>
            <p>{{ ch.content }}</p>
        </div>
        {% endfor %}

        <div style="margin-top: 35px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/student_dashboard" class="back-link">← Return to Dashboard</a>
            <a href="/assessment/{{ course._id }}" class="btn">Take Final Assessment →</a>
        </div>
    </div>
</body>
</html>
