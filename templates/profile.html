<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - NoSQLVerse</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #090d16; color: #f8fafc; padding: 50px 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #111827; padding: 35px; border-radius: 12px; border: 1px solid #1f2937; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #090d16; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; color: white; font-size: 14px; }
        button { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 15px; font-size: 15px; }
        button:hover { background: #1d4ed8; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Edit Student Profile</h2>
        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="{{ user.name }}" required>
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" value="{{ user.age }}" required>
            </div>
            <div class="form-group">
                <label>College / University</label>
                <input type="text" name="college" value="{{ user.college }}" required>
            </div>
            <div class="form-group">
                <label>Degree / Major Program</label>
                <input type="text" name="course" value="{{ user.course }}" required>
            </div>
            <button type="submit">Save Changes 💾</button>
        </form>
        <a href="/student_dashboard" class="back-link">← Back to Dashboard</a>
    </div>
</body>
</html>
